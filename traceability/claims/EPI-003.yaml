id: EPI-003
name: The contested branch point is uniformitarian historical inference, not the exit of final causes
statement: >
  The transition of the natural sciences from design-assuming natural philosophy to what
  is now called methodological naturalism was TWO transitions, and CAC contests only the
  second.
  (1) FINAL CAUSES EXIT PROXIMATE EXPLANATION - Bacon's Novum Organum (1620) separating
  final from efficient causes, Descartes' Principia Philosophiae (1644) barring final
  causes from physics. Method thereafter excludes teleological explanation from the
  account of how a system operates. CAC DOES NOT CONTEST THIS. EPI-002's methodological
  designism is compatible with it by construction: conduct inquiry expecting stable law
  while holding the metaphysics open.
  (2) UNIFORMITARIAN HISTORICAL INFERENCE - Hutton's Theory of the Earth (1788), Lyell's
  Principles of Geology (1830-33): explain the past by causes now in operation, at rates
  now observed. THIS is the commitment CAC contests, because it is a claim about
  HISTORICAL BOUNDARY CONDITIONS rather than about operational method, and it is the
  direct ancestor of the prior EPI-001 identifies as driving standard age determinations.
  The distinction matters because a programme that appears to contest (1) is contesting
  the exclusion of teleology from physics, which CAC does not do and which would make it
  the "God of the gaps" position it disclaims.
