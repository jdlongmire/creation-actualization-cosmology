risk_if_false: >
  If the two transitions were really one, CAC's objection would land against the
  exclusion of final causes from operational physics - which EPI-002 explicitly accepts -
  and the programme would be internally inconsistent at the point where it claims to be
  most disciplined.
notes: >
  THE LABEL IS RETROSPECTIVE. "Methodological naturalism" is a 20th-century coinage (de
  Vries 1983/1986; Brightman earlier), so no 17th- or 19th-century practitioner described
  himself that way. Citing period figures as adherents of a named doctrine they never
  held would be an anachronism a reviewer will catch immediately; the claim is about what
  their METHOD assumed, not about a label they used.
  THE RIVAL ACCOUNT, AT ITS STRONGEST, AND IT IS STRONG. The branch was not a
  philosophical coup imposed on a working science. It was earned by explanatory success,
  and the decisive evidence is that diluvial geology was abandoned BY ITS OWN LEADING
  PRACTITIONER on the evidence: William Buckland, the most prominent scientific
  diluvialist in Britain, dropped the geological-deluge / biblical-Flood correlation in
  his own 1836 Bridgewater Treatise and accepted Agassiz's glacial explanation by 1840.
  A programme proposing to reopen the branch point owes an account of why that
  abandonment was wrong ON THE EVIDENCE THEN AVAILABLE, not merely a diagnosis of the
  priors that followed it. CAC has not supplied one, and this claim does not supply one.
  IT CANNOT CORROBORATE PRD-001 OR PRD-002, and reading it that way would be the exact
  error the programme's ledger exists to prevent. The trajectory from 1830 to the present
  is an ALREADY-KNOWN fact; treating it as confirmation of a trajectory prediction is
  accommodation wearing a prediction's clothes. Both PRD claims are scored forward over
  future data releases for precisely this reason. What this claim supplies is scope and
  motivation: it names WHERE the disagreement is, so the predictions are not read as
  attacks on operational method.
  WHAT IT SHARPENS. Lyellian uniformitarianism is the historical-boundary-condition
  assumption whose consequences PRD-001 and PRD-002 test. Inflation is a modern instance
  of the same move at the cosmological scale - deriving the observed state from generic
  initial data rather than specifying it - which is why PRD-002 names it as the rival.
