risk_if_false: >
  If TRT's core did fix a temporal profile for A, the disposition reopens and one of
  the two belts is inconsistent with the shared ontology rather than an alternative
  development of it. EXT-003 is the load-bearing premise; it rests on a refutation
  TRT registered against its own hypothesis, which is strong evidence but is a single
  source.
notes: >
  Opened at stand-up by reading ADCE directly rather than the position paper's section
  7 summary. Closed the same day on TRT's own registered refutation rather than on a
  compromise between the programmes. COST CARRIED, not dropped: underdetermination
  means the core does not entail discreteness either, so section 7's "naturally
  derives from" is wrong and becomes "adopts the ontology of" in v0.2. Produced two
  results: EXT-003 (the free parameter) and EXT-004 (the disambiguation obligation,
  which constrains OPN-010).
  SHARPENED 2026-08-04 on JD's observation that ADCE's structure could itself have
  originated functionally mature. "Divergent belts" was too strong: it was right about
  the free parameter and wrong about the consequence. Act and rate answer different
  questions - initial condition versus growth law - and on ADCE's rate-shaped laws they
  compose into a joint position neither belt stated (EXT-005). The divergence that
  survives is narrower and stock-shaped, at OPN-012.
  WHAT THE SHARPENING DOES NOT CHANGE: compatibility is PERMISSION, NOT DERIVATION. The
  underdetermination argument that establishes it is the same one that killed section
  7's "naturally derives from", and keeping only the favourable half would be the
  conventionalist twist in CAC's own favour. Nor are the cores equally warranted - TRT
  claims immunity by necessity (the denial of L3 is self-refuting), CAC by methodological
  decision, and CAC cannot inherit TRT's warrant by adopting its ontology.
