id: OPN-008
name: Consistency with TRT's belt-level cosmology (ADCE) - RESOLVED
statement: >
  RESOLVED 2026-08-03 (PI-1 O2a), SHARPENED 2026-08-04. Disposition: COMPATIBLE CORES,
  COMPOSABLE BELTS. The two hard cores share no proposition on which they could
  disagree - TRT's constrains the form and status of the actual (the central identity,
  the three primitives, the four-tier engine) and fixes no content, occasion or
  duration for any particular actualization; CAC's makes historical and content claims
  about one actualization event. Every CAC commitment is one TRT's core leaves open,
  and no TRT commitment is one CAC denies. The belts differ on the temporal profile of
  actualizing action, a parameter TRT's core genuinely leaves free (EXT-003), and TRT's
  own registry says so: "The TRT hard core is untouched either way." The 2026-08-04
  sharpening: on ADCE's rate-shaped bridge laws the belts do not merely coexist, they
  COMPOSE - a mature initial stock is invisible to a scale-free growth law (EXT-005).
  Neither belt is positioned to supersede the other - ADCE's severe test failed across
  the natural bridge-law grid in every cell, and CAC has zero predictions.
tier: 2
role: derived
proof_status: prose_only
epistemic_status: argued
depends_on:
