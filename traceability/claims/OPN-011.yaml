id: OPN-011
name: CAC has no likelihood function
statement: >
  The programme has not specified P(E | H_CAC): what a discretely actualized cosmos should
  be expected to look like, in what respects, with what distribution. EPI-001 correctly
  identifies that the prior is doing the work in standard age determinations, but a prior
  shift cannot be computed without a likelihood on the other side. Supplying one is the
  precondition of every observational claim the programme might make.
tier: 2
role: open
proof_status: open
epistemic_status: open
depends_on:
  - claim_id: EPI-001
    dependency_type: logical
  - claim_id: EPI-002
    dependency_type: logical
  - claim_id: CRE-006
    dependency_type: logical
risk_if_false: >
  Without a likelihood the programme forbids nothing: any observation is absorbable by
  "your priors generated that inference." That is unfalsifiability in its strongest form
  and is the direct cause of the progressiveness ledger reading zero. OPN-007 (a
  discriminator) is unreachable until this is supplied.
notes: >
  Registered 2026-08-03 when JD's Origins Framework stated the apparent-age argument in
  explicitly Bayesian terms. Holding the argument to its own standard is what surfaced
  the gap - the framework names the factor standard practice gets wrong and, in doing so,
  names exactly the factor CAC has not supplied.
  This now SUPERSEDES OPN-010 as the sharpest open problem. OPN-010 asked the programme to
  state a position on processes in transit; the Origins Framework states one (see
  OPN-010's own notes). What remains is not a position but a FUNCTION, and it is the same
  function OPN-007 needs. Where to start: EPI-002's constructive limb, since ordinary law
  acting on a specified initial state has computable consequences and is the one place the
  likelihood is not hostage to the creation act itself.
  TWO CANDIDATE ROUTES REGISTERED 2026-08-04, both from the Origins Framework v0.2 pass.
  (1) OPN-012 - the 4-volume stock dependence of everpresent Lambda, the first thing the
  programme has produced that is shaped like a likelihood rather than like a reply to an
  objection. Confidence LOW and the literature check is not done.
  (2) THE DIRECTIONAL-RESIDUAL REFORMULATION of Origins Framework point 7. The anomaly
  list as stated is an argument from the existence of surprises, which does not run
  without the likelihood this claim says is missing - and which any progressing programme
  would survive, since open problems are what a live research programme feeds on. The
  form that could run is the claim that the residuals are DIRECTIONALLY BIASED: that
  observed systems are systematically MORE mature, ordered or intact than gradualist
  expectation, never systematically less. That version forbids something and is the
  reason point 7 is stated in the framework but deliberately NOT registered as ten
  accommodations - see origins-framework.md.
