id: OPN-012
name: The 4-volume stock dependence of everpresent Lambda - first computable discriminator lead
statement: >
  Causal-set kinematics supplies one quantity that depends on the actualized STOCK
  rather than on its growth rate: the fluctuation-driven cosmological constant
  Lambda ~ +/- hbar / sqrt(V_4) (Sorkin 1997; Ahmed, Dodelson, Greene and Sorkin 2004),
  which ADCE registers as its declared rival. Two questions follow for CAC, and both are
  computable rather than hermeneutic.
  (a) MAGNITUDE. With V_4 ~ (ct)^4, Lambda scales as t^(-2). Substituting a realized
  4-volume of order 10^4 yr for one of order 10^10 yr raises Lambda by roughly thirteen
  orders of magnitude against the observed value. If CAC adopts causal-set kinematics at
  all, it must actualize V_4 itself mature, not merely its contents - EXT-004 branch two
  in its most committing form.
  (b) SPECTRUM. The fluctuation delta-N ~ sqrt(N) is a statistic OF A BIRTH PROCESS.
  A stock produced in a single act does not obviously carry the same fluctuation
  spectrum as one grown over 10^10 yr. If that difference survives being made precise,
  act-versus-accumulation has an observational signature in Lambda-fluctuation
  phenomenology.
tier: 2
