  - "triadic-reality-theory 2-theory/04-cosmology/adce.md v3.2.1 section 11 (the mean-growth versus fluctuation rivalry)"
risk_if_false: >
  Limb (a) is arithmetic and is unlikely to be wrong in direction, though the exponent
  depends on how V_4 is defined for a non-traversed history - which is precisely the
  question CAC has not answered. Limb (b) may already be closed in the causal-set
  literature, in which case the lead dies and OPN-011 loses its only computable route
  found so far.
notes: >
  CONFIDENCE LOW, and the literature check has NOT been done. Registering it as a lead
  rather than a result. Before any development: read whether the causal-set literature
  already treats a non-accumulated stock, since the fluctuation phenomenology may
  presuppose the birth process in a way that settles limb (b) immediately.
  WHY IT MATTERS DESPITE THE LOW CONFIDENCE. This is the first thing the programme has
  produced that is shaped like P(E | H_CAC) rather than like a reply to an objection.
  Limb (a) is CAC eliminating one of its own belt options on a calculation, which is
  internal progress but forbids no observation. Limb (b) would forbid an observation if
  it survives, and is therefore the live one.
  Arose 2026-08-03 from JD's observation that ADCE's structure could itself have
  originated functionally mature. That move is correct on the rate-shaped laws
  (EXT-005); this claim registers the one place it is not free.
