id: CRE-007
name: Operational completeness does not entail deception
statement: >
  CAC does not assert that God fabricated a fictitious history. It asserts that the created
  state was sufficient to accomplish its intended purposes immediately. This is functionality,
  not false testimony, and is distinct from nineteenth-century appearance-of-age arguments.
tier: 1
role: bridge
proof_status: prose_only
epistemic_status: argued
depends_on:
  - claim_id: CRE-003
    dependency_type: logical
  - claim_id: CRE-006
    dependency_type: logical
source_documents:
  - doc: CAC-v0.1
    section: "3"
  - doc: origins-framework
    section: "point 2"
risk_if_false: >
  If the distinction from appearance-of-age cannot be sustained, the programme inherits the
  omphalos objection in full and its theological warrant is undercut by its own doctrine of God.
notes: >
  UPGRADED 2026-08-03 from asserted to argued. The stand-up audit recorded that the paper
  asserted this without argument; JD's Origins Framework (point 2) supplies one by
  generalizing the maturity pattern beyond Creation Week - the wine at Cana, healings that
  skip the normal biological process. The Cana wine had chemical properties a chemist would
  date to years of fermentation and deceived no one, because deception requires an intent to
  induce false belief and a functional artifact produced for a stated function makes no claim
  about its own provenance. Combined with EPI-001 (the chronological inference is supplied by
  the observer's priors, not asserted by the artifact), the deception charge does not attach.
  RESIDUAL: the argument is strongest for CONFIGURATIONS (mature wine, mature tree). Distant
  records of PROCESSES with internal duration and cross-channel consistency (OPN-010) are a
  harder case, and the reply there runs through the functional purpose of the luminaries
  (HER-002) rather than through the Cana analogy directly.
