id: EXT-001
name: TRT ontology - reality as constrained information in action
statement: >
  Imported from Triadic Reality Theory: actual reality is constrained information in action,
  chi = A(I | L), where logic constrains information and actualization produces physical
  reality. Creation is accordingly the intentional actualization of coherent informational
  structure rather than the emergence of order from disorder.
tier: 2
role: imported
proof_status: imported
epistemic_status: conjectured
source_documents:
  - doc: CAC-v0.1
    section: "7"
external_citations:
  - "Longmire, J.D. (2026). Triadic Reality Theory, v0.9. github.com/jdlongmire/triadic-reality-theory"
risk_if_false: >
  CAC loses its ontological setting for "actualization" as a primitive act. The programme
  could be restated without TRT, but "discrete divine actualization" would then be a
  theological description with no formal home.
notes: >
  The import is at the level of ONTOLOGY only. TRT's belt-level cosmology (ADCE) is NOT
  imported. Their relation was dispositioned 2026-08-03 as COMMON ONTOLOGY, DIVERGENT
  BELTS - see OPN-008, EXT-003, and 1-hypothesis/relation-to-trt.md. The import supplies
  a formal home for actualization-as-primitive-act; it does NOT supply an argument for
  discreteness, since the core underdetermines the temporal profile of A in both
  directions (EXT-003).
